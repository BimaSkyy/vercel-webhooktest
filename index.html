<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pemantau Data Farm - Panel Terpisah</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      scrollbar-width: thin;
      scrollbar-color: #475569 #1e293b;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1e293b; border-radius: 999px; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 999px; }

    /* Animasi umum */
    .panel { transition: all 0.25s ease; border-radius: 1rem; border: 1px solid #334155; }
    .panel-berubah { background-color: rgba(16, 185, 129, 0.12); transform: scale(1.008); }
    .baris-baru { animation: masuk 0.4s ease; }
    @keyframes masuk { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: translateX(0); } }

    /* Animasi angka naik */
    .angka-naik { color: #4ade80; font-weight: bold; position: relative; }
    .tanda-tambah {
      position: absolute; left: -26px; font-size: 0.8rem; color: #fbbf24;
      animation: melayang 0.7s ease-out forwards; pointer-events: none;
    }
    @keyframes melayang { 0% {opacity:1;transform:translateY(0)} 100% {opacity:0;transform:translateY(-16px)} }

    /* Animasi uang */
    .kotak-uang { transition: all 0.3s ease; }
    .uang-berubah { animation: kilau 0.5s ease; background-color: rgba(234, 179, 8, 0.15); }
    @keyframes kilau { 0%,100% {box-shadow:none} 50% {box-shadow:0 0 10px rgba(234,179,8,0.3)} }

    /* Gulir otomatis */
    .daftar-gulir { max-height: 230px; overflow-y: auto; scroll-behavior: smooth; }
    .log-panen { max-height: 170px; overflow-y: auto; scroll-behavior: smooth; }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen p-3 md:p-4">
  <div class="w-full max-w-3xl mx-auto">
    <!-- Judul -->
    <h1 class="text-2xl font-bold text-center mb-5 text-emerald-400">📡 Pemantauan Langsung</h1>

    <!-- Info Atas -->
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div class="panel p-3 bg-slate-800">
        <div class="text-slate-400 text-sm">🕒 Waktu Terima</div>
        <div id="waktu" class="font-semibold text-lg">—</div>
      </div>
      <div class="panel p-3 bg-slate-800">
        <div class="text-slate-400 text-sm">📶 Pengirim</div>
        <div id="pengirim" class="font-semibold text-emerald-300">—</div>
      </div>
    </div>

    <!-- 🟢 PANEL 1: DATA UTAMA & BARANG -->
    <div id="panelBarang" class="panel p-4 bg-slate-800 mb-4">
      <div id="isiBarang" class="daftar-gulir text-sm leading-relaxed pr-2">
        <span class="text-amber-400">Menunggu data...</span>
      </div>
    </div>

    <!-- 🟡 RINGKASAN ANGKA -->
    <div class="grid grid-cols-3 gap-3 mb-4">
      <div id="kotakUang" class="kotak-uang panel p-3 bg-slate-800 text-center">
        <div class="text-slate-400 text-sm">💰 Uang</div>
        <div id="nilaiUang" class="font-bold text-lg text-yellow-400">—</div>
      </div>
      <div class="panel p-3 bg-slate-800 text-center">
        <div class="text-slate-400 text-sm">📦 Total Berat</div>
        <div id="nilaiBerat" class="font-bold text-lg text-sky-400">—</div>
      </div>
      <div class="panel p-3 bg-slate-800 text-center">
        <div class="text-slate-400 text-sm">🧾 Total Item</div>
        <div id="nilaiItem" class="font-bold text-lg text-sky-400">—</div>
      </div>
    </div>

    <!-- 🔵 PANEL 2: LOG HASIL PANEN TERKASIH -->
    <div id="panelPanen" class="panel p-4 bg-slate-800">
      <h3 class="text-sky-400 font-semibold mb-2">🌾 Log Panen Terbaru</h3>
      <div id="isiLogPanen" class="log-panen text-sm pr-2 text-emerald-300">
        <span class="text-slate-500">Belum ada hasil panen...</span>
      </div>
    </div>

    <p class="text-center text-slate-500 text-sm mt-4">🔄 Memeriksa otomatis setiap 3 detik</p>
  </div>

  <script>
    let dataLama = { uang: "", barang: {}, riwayatPanen: [] };
    let teksSebelum = "";

    // Tandai panel berubah
    function tandaiPanelBerubah(id) {
      const el = document.getElementById(id);
      el.classList.add("panel-berubah");
      setTimeout(() => el.classList.remove("panel-berubah"), 400);
    }

    // Bandingkan jumlah barang & beri tanda tambah
    function cekPerubahanBarang(nama, jumlahBaru) {
      const jumlahLama = dataLama.barang[nama] || 0;
      if (jumlahBaru > jumlahLama) {
        const selisih = jumlahBaru - jumlahLama;
        return `<span class="angka-naik">${jumlahBaru}</span><span class="tanda-tambah">+${selisih}</span>`;
      }
      return jumlahBaru;
    }

    // Pisahkan isi barang & panen
    function uraikanData(teksMentah) {
      if (!teksMentah) return { barang: "<span class='text-amber-400'>Data kosong</span>", panenBaru: [] };

      const baris = teksMentah.split("\n");
      let bagianBarang = "";
      let bagianPanenBaru = [];
      let dalamBagianPanen = false;
      let uangSekarang = "";
      let barangBaru = {};

      for (const b of baris) {
        const t = b.trim();
        if (!t) continue;

        // Judul & Info Umum
        if (t.includes("DATA FARM") || t.startsWith("👤")) {
          bagianBarang += `<div class="text-emerald-400 font-bold text-xl mb-2">${t}</div>`;
        }
        // Jumlah Uang
        else if (t.includes("Jumlah Uang:")) {
          uangSekarang = t.match(/[\d\.MKGT]+/)?.[0] || "";
          const adaPerubahan = uangSekarang !== dataLama.uang;
          bagianBarang += `<div class="text-lg font-semibold text-yellow-400 mb-3 ${adaPerubahan?'angka-naik':''}">💰 ${t}</div>`;
          if (adaPerubahan) {
            document.getElementById("kotakUang").classList.add("uang-berubah");
            setTimeout(() => document.getElementById("kotakUang").classList.remove("uang-berubah"), 600);
          }
        }
        // Awal Daftar Barang
        else if (t.includes("Item Backpack:")) {
          dalamBagianPanen = false;
          bagianBarang += `<div class="text-sky-400 font-semibold mb-2">🎒 ${t}</div><div class="pl-2">`;
        }
        // Awal Daftar Panen
        else if (t.includes("Hasil Panen:")) {
          dalamBagianPanen = true;
          bagianBarang += `</div><div class="text-sky-400 font-semibold mb-3 mt-4">🌾 ${t}</div><div class="pl-2">`;
        }
        // Barang biasa
        else if (!dalamBagianPanen && /^•?\s*(.+?)\s+x(\d+)/.test(t)) {
          const [_, nama, jml] = t.match(/^•?\s*(.+?)\s+x(\d+)/);
          barangBaru[nama] = parseInt(jml);
          const tampil = cekPerubahanBarang(nama, parseInt(jml));
          bagianBarang += `<div class="mb-1 relative">• ${nama} x${tampil}</div>`;
        }
        // Barang hasil panen → masuk daftar baru
        else if (dalamBagianPanen && t.includes("KG")) {
          bagianPanenBaru.push(t);
          bagianBarang += `<div class="text-emerald-300 mb-1">• ${t}</div>`;
        }
        // Ringkasan bawah
        else if (t.includes("Total Berat") || t.includes("Total Item") || t.includes("Waktu:")) {
          bagianBarang += `<div class="text-amber-400 mt-3 text-sm">${t}</div>`;
        }
        else {
          bagianBarang += `<div class="text-slate-300 mb-1">${t}</div>`;
        }
      }

      // Simpan data lama untuk perbandingan berikutnya
      dataLama.uang = uangSekarang;
      dataLama.barang = barangBaru;

      return { barang: bagianBarang, panenBaru: bagianPanenBaru };
    }

    // Gabung log panen lama + baru, masuk satu per satu
    function perbaruiLogPanen(daftarBaru) {
      if (daftarBaru.length === 0) return;

      // Tambah hanya yang belum ada sebelumnya
      let adaBaru = false;
      for (const item of daftarBaru) {
        if (!dataLama.riwayatPanen.includes(item)) {
          dataLama.riwayatPanen.push(item);
          adaBaru = true;
        }
      }

      // Simpan maksimal 20 baris terakhir saja
      if (dataLama.riwayatPanen.length > 20) {
        dataLama.riwayatPanen = dataLama.riwayatPanen.slice(-20);
      }

      // Tampilkan dengan animasi baris baru
      const htmlLog = dataLama.riwayatPanen.map((teks, i) => 
        `<div class="py-1 border-b border-slate-700/40 ${adaBaru && i === dataLama.riwayatPanen.length - 1 ? 'baris-baru' : ''}">${teks}</div>`
      ).join("");

      document.getElementById("isiLogPanen").innerHTML = htmlLog;
      tandaiPanelBerubah("panelPanen");

      // Gulir ke bawah log panen
      setTimeout(() => {
        document.getElementById("isiLogPanen").scrollTop = document.getElementById("isiLogPanen").scrollHeight;
      }, 50);
    }

    // Ambil & perbarui semua
    async function muatDanTampil() {
      try {
        const res = await fetch("/api/webhook", { cache: "no-store" });
        if (!res.ok) throw new Error("Gagal terhubung");
        const data = await res.json();
        const teksBaru = data.konten || "";

        // Hanya proses jika ada perubahan isi
        if (teksBaru !== teksSebelum) {
          teksSebelum = teksBaru;
          const { barang, panenBaru } = uraikanData(teksBaru);

          // Tampilkan barang
          document.getElementById("isiBarang").innerHTML = barang;
          tandaiPanelBerubah("panelBarang");

          // Tampilkan log panen bertahap
          perbaruiLogPanen(panenBaru);

          // Gulir otomatis ke bawah panel barang
          setTimeout(() => {
            document.getElementById("isiBarang").scrollTop = document.getElementById("isiBarang").scrollHeight;
          }, 50);

          // Isi angka ringkasan
          const cocokBerat = teksBaru.match(/Total Berat:\s*([\d\.MKGT]+)/);
          const cocokJumlah = teksBaru.match(/Total Item:\s*(\d+)/);
          document.getElementById("nilaiBerat").textContent = cocokBerat ? cocokBerat[1] + " KG" : "—";
          document.getElementById("nilaiItem").textContent = cocokJumlah ? cocokJumlah[1] : "—";
        }

        // Perbarui waktu & pengirim
        document.getElementById("waktu").textContent = data.waktu || "—";
        document.getElementById("pengirim").textContent = data.pengirim || "—";

      } catch (err) {
        document.getElementById("isiBarang").innerHTML = '<span class="text-red-400">❌ Terputus — cek Termux</span>';
      }
    }

    muatDanTampil();
    setInterval(muatDanTampil, 3000);
  </script>
</body>
</html>
