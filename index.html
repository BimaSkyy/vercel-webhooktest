<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pemantau Data Farm</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-3xl bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700">
    <h1 class="text-2xl font-bold text-center mb-6 text-emerald-400">📡 Data Pemantauan Langsung</h1>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
      <div class="p-4 bg-slate-700/50 rounded-xl">
        <span class="text-slate-400">Waktu Terima:</span>
        <div id="waktu" class="font-semibold text-lg">—</div>
      </div>
      <div class="p-4 bg-slate-700/50 rounded-xl">
        <span class="text-slate-400">Asal Pengirim:</span>
        <div id="pengirim" class="font-semibold text-lg">—</div>
      </div>
    </div>

    <div class="mt-2">
      <span class="text-slate-400 font-medium">📋 Isi Laporan:</span>
      <div id="konten" class="mt-3 bg-slate-900 p-5 rounded-xl overflow-x-auto text-sm leading-relaxed min-h-[150px]">
        <span class="text-amber-400">Menunggu kiriman dari Termux...</span>
      </div>
    </div>

    <p class="text-center text-slate-500 text-sm mt-6">🔄 Memeriksa data baru setiap 3 detik</p>
  </div>

  <script>
    // Ubah teks mentah jadi tampilan rapi
    function formatTeks(teks) {
      if (!teks || !teks.trim()) return '<span class="text-slate-500">— kosong —</span>';
      const baris = teks.split('\n');
      let html = '';

      baris.forEach(b => {
        const t = b.trim();
        if (!t) return;

        if (t.includes("DATA FARM") || t.startsWith("👤")) {
          html += `<div class="text-emerald-400 font-bold text-lg mb-2">${t}</div>`;
        } else if (/^[─-]{5,}$/.test(t)) {
          html += `<div class="border-b border-slate-700 my-3"></div>`;
        } else if (t.includes("Uang") || t.includes("Item") || t.includes("Panen") || t.includes("Total")) {
          html += `<div class="text-sky-400 font-semibold mt-2 mb-1">${t}</div>`;
        } else if (/x\d+/.test(t) || t.includes("KG")) {
          html += `<div class="text-emerald-300 pl-3 mb-1">• ${t}</div>`;
        } else if (t.includes("Waktu") || t.includes("Masih Berjalan")) {
          html += `<div class="text-amber-400 mt-3 text-sm">${t}</div>`;
        } else {
          html += `<div class="text-slate-300 mb-1">${t}</div>`;
        }
      });
      return html;
    }

    // Ambil data berulang kali
    async function ambilDanTampil() {
      try {
        const res = await fetch("/api/webhook", {cache:"no-store"}); // ❗Tolak data lama dari tembolok
        if (!res.ok) throw new Error("Respon tidak normal");

        const d = await res.json();
        document.getElementById("waktu").textContent = d.waktu || "—";
        document.getElementById("pengirim").textContent = d.pengirim || "—";
        document.getElementById("konten").innerHTML = formatTeks(d.konten);

      } catch (err) {
        document.getElementById("konten").innerHTML = 
          '<span class="text-red-400">⚠️ Tidak dapat terhubung — pastikan skrip Termux berjalan & baru saja mengirim data</span>';
      }
    }

    ambilDanTampil();
    setInterval(ambilDanTampil, 3000); // ✅ Berjalan otomatis tanpa perlu segarkan
  </script>
</body>
</html>
