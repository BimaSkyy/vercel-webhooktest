<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penerima Webhook - Data Farm</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-3xl bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700">
    <!-- Judul -->
    <h1 class="text-2xl font-bold text-center mb-6 text-emerald-400">📡 Data Terima Webhook</h1>

    <!-- Waktu Terima -->
    <div class="mb-6 p-4 bg-slate-700/50 rounded-xl">
      <span class="text-slate-400">Waktu Terima:</span>
      <div id="waktu" class="font-semibold text-lg text-white mt-1">—</div>
    </div>

    <!-- Isi Data - Tampilan Terstruktur -->
    <div class="mt-6">
      <span class="text-slate-400 font-medium">📋 Isi Data:</span>
      <div id="isiData" class="mt-3 bg-slate-900 p-5 rounded-xl overflow-x-auto text-sm leading-relaxed">
        <span class="text-slate-500">Menunggu data...</span>
      </div>
    </div>

    <p class="text-center text-slate-500 text-sm mt-6">Diperbarui otomatis setiap 3 detik</p>
  </div>

  <script>
    // Fungsi ubah teks mentah jadi tampilan rapi dengan pemisah & bagian
    function formatDataTeks(teksMentah) {
      if (!teksMentah) return '<span class="text-red-400">⚠️ Data kosong</span>';

      // Pisah per baris
      const baris = teksMentah.split('\n');
      let hasilHTML = '';
      let adaGaris = false;

      baris.forEach(barisTeks => {
        const teks = barisTeks.trim();
        if (!teks) return;

        // Judul utama → besar & hijau terang
        if (teks.includes('DATA FARM') || teks.startsWith('👤')) {
          hasilHTML += `<div class="text-emerald-400 font-bold text-lg mb-2 mt-1">${teks}</div>`;
          adaGaris = true;
        }
        // Garis pemisah → ubah jadi garis cantik
        else if (teks.match(/^[-─]+$/)) {
          hasilHTML += `<div class="border-b border-slate-700 my-4"></div>`;
        }
        // Bagian judul kategori → tebal & biru
        else if (teks.includes('Item Backpack') || teks.includes('Hasil Panen') || teks.includes('Total') || teks.includes('Uang')) {
          hasilHTML += `<div class="text-sky-400 font-semibold mt-3 mb-2">${teks}</div>`;
        }
        // Daftar barang → masukkan dalam daftar dengan sedikit jarak
        else if (teks.match(/^[a-zA-Z0-9\s\[\]]+ x\d+/) || teks.match(/\[.*KG\]/)) {
          hasilHTML += `<div class="text-emerald-300 pl-3 mb-1">• ${teks}</div>`;
        }
        // Waktu atau status lain → abu terang
        else if (teks.includes('Waktu') || teks.includes('Berjalan')) {
          hasilHTML += `<div class="text-amber-400 mt-3 text-sm">${teks}</div>`;
        }
        // Baris biasa
        else {
          hasilHTML += `<div class="text-slate-300 mb-1">${teks}</div>`;
        }
      });

      return hasilHTML;
    }

    // Ambil data dari API & tampilkan
    async function ambilData() {
      try {
        const res = await fetch("/api/webhook");
        const data = await res.json();
        
        // Tampilkan waktu
        document.getElementById("waktu").textContent = data.waktu;
        
        // Tampilkan data yang sudah diformat rapi
        const elemenIsi = document.getElementById("isiData");
        elemenIsi.innerHTML = formatDataTeks(data.isi);

      } catch (err) {
        document.getElementById("isiData").innerHTML = 
          '<span class="text-red-400">❌ Gagal terhubung ke server</span>';
      }
    }

    ambilData();         // Jalankan pertama kali
    setInterval(ambilData, 3000); // Perbarui otomatis
  </script>
</body>
</html>
