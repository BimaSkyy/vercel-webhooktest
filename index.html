<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pemantau Lengkap + Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { scrollbar-width: thin; scrollbar-color: #475569 #1e293b; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1e293b; border-radius: 999px; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 999px; }

    .panel { transition: all 0.2s ease; border-radius: 1rem; border: 1px solid #334155; background: #1e293b; }
    .panel-aktif { background: rgba(16,185,129,0.15); transform: scale(1.005); }
    .baris-masuk { animation: masuk 0.3s ease; }
    @keyframes masuk { from{opacity:0;transform:translateX(-6px)} to{opacity:1;transform:translateX(0)} }

    .tinggi-panjang { max-height: 400px; overflow-y: auto; scroll-behavior: smooth; }
    .tinggi-sedang { max-height: 280px; overflow-y: auto; scroll-behavior: smooth; }
    .tinggi-pendek { max-height: 220px; overflow-y: auto; scroll-behavior: smooth; }
    .whitespace-pre { white-space: pre-line; line-height: 1.6; }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen p-3 md:p-4">
  <div class="w-full max-w-4xl mx-auto">
    <!-- Atas -->
    <div class="flex items-center justify-between mb-5">
      <h1 class="text-2xl font-bold text-emerald-400">📡 Pemantau Langsung</h1>
      <button id="btnRelog" class="px-4 py-2 rounded-xl font-semibold bg-blue-600 hover:bg-blue-700">🔄 Relog Server</button>
    </div>

    <div class="grid grid-cols-2 gap-3 mb-4">
      <div class="panel p-3"><div class="text-slate-400 text-sm">🕒 Waktu</div><div id="waktu" class="font-semibold">—</div></div>
      <div class="panel p-3"><div class="text-slate-400 text-sm">📶 Status</div><div id="statusRelog" class="font-semibold text-sky-300">Siap</div></div>
    </div>

    <div class="grid grid-cols-3 gap-3 mb-4">
      <div class="panel p-3 text-center"><div class="text-slate-400 text-sm">💰 Uang</div><div id="nilaiUang" class="font-bold text-lg text-yellow-400">—</div></div>
      <div class="panel p-3 text-center"><div class="text-slate-400 text-sm">📦 Berat</div><div id="nilaiBerat" class="font-bold text-lg text-sky-400">—</div></div>
      <div class="panel p-3 text-center"><div class="text-slate-400 text-sm">🧾 Jumlah</div><div id="nilaiJumlah" class="font-bold text-lg text-sky-400">—</div></div>
    </div>

    <!-- Cuaca & Restock -->
    <div id="panelCuaca" class="panel p-4 mb-4">
      <h3 class="text-sky-400 font-semibold mb-2">🌤 Cuaca & Restock</h3>
      <div id="isiCuaca" class="tinggi-pendek text-sm pl-3 whitespace-pre text-slate-200">Menunggu...</div>
    </div>

    <!-- Pet di Peta -->
    <div id="panelPet" class="panel p-4 mb-4">
      <h3 class="text-sky-400 font-semibold mb-2">🐾 Pet di Peta</h3>
      <div id="isiPet" class="tinggi-pendek text-sm pl-3 text-emerald-300 whitespace-pre">—</div>
    </div>

    <!-- ✅ DAFTAR PEMAIN -->
    <div id="panelPemain" class="panel p-4 mb-4">
      <h3 class="text-sky-400 font-semibold mb-2">👥 Pemain di Server (Urut Uang)</h3>
      <div id="isiPemain" class="tinggi-pendek text-sm pl-3 whitespace-pre text-amber-200">—</div>
    </div>

    <!-- ✅ CHAT RIWAYAT -->
    <div id="panelChat" class="panel p-4 mb-4">
      <h3 class="text-sky-400 font-semibold mb-2">💬 Obrolan Terakhir</h3>
      <div id="isiChat" class="tinggi-sedang text-sm pl-3 whitespace-pre text-slate-300">—</div>
      <!-- ✅ KIRIM PESAN -->
      <div class="mt-3 flex gap-2">
        <input id="inputPesan" type="text" placeholder="Ketik pesan..." class="flex-1 bg-slate-700 rounded-lg px-3 py-2 text-white border border-slate-600 focus:outline-none focus:border-blue-500">
        <button id="btnKirim" class="bg-emerald-600 hover:bg-emerald-700 px-4 py-2 rounded-lg font-semibold">Kirim</button>
      </div>
    </div>

    <!-- Barang & Riwayat Lama -->
    <div id="panelBarang" class="panel p-4 mb-4">
      <h3 class="text-sky-400 font-semibold mb-2">🎒 Barang di Tas</h3>
      <div id="isiBarang" class="tinggi-panjang text-sm pl-3">—</div>
    </div>

    <div id="panelLog" class="panel p-4">
      <h3 class="text-sky-400 font-semibold mb-2">📜 Riwayat Panen/Jual</h3>
      <div id="isiLog" class="tinggi-sedang text-sm pl-3">—</div>
    </div>

    <p class="text-center text-slate-500 text-sm mt-4">🔄 Perbarui otomatis tiap 2 detik</p>
  </div>

  <script>
    let simpan = { uang:"", barang:{}, riwayat:[] };
    const MAKS_LOG = 20;
    let teksLama = "";
    let sedangRelog = false;

    const btnRelog = document.getElementById("btnRelog");
    const statusRelog = document.getElementById("statusRelog");
    const btnKirim = document.getElementById("btnKirim");
    const inputPesan = document.getElementById("inputPesan");

    // Tombol Relog
    btnRelog.addEventListener("click", async () => {
      sedangRelog = true;
      btnRelog.disabled = true;
      btnRelog.textContent = "⏳ Mengirim...";
      statusRelog.textContent = "Mengirim perintah...";
      await fetch("/api/relog", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({perintah:"true"})});
    });

    // ✅ Tombol Kirim Pesan
    async function kirimPesan() {
      const teks = inputPesan.value.trim();
      if(!teks) return;
      btnKirim.disabled = true;
      btnKirim.textContent = "Mengirim...";
      await fetch("/api/kirimchat", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pesan:teks})});
      inputPesan.value = "";
      btnKirim.disabled = false;
      btnKirim.textContent = "Kirim";
    }
    btnKirim.addEventListener("click", kirimPesan);
    inputPesan.addEventListener("keydown", e=>{if(e.key==="Enter")kirimPesan()});

    function tandai(id){const el=document.getElementById(id);el.classList.add("panel-aktif");setTimeout(()=>el.classList.remove("panel-aktif"),400);}

    function cekPerubahan(nama,jml,jenis){
      const l=simpan[jenis][nama]||0;
      if(jml===l)return{teks:jml,ada:false};
      simpan[jenis][nama]=jml;
      return jml>l?{teks:`<span class="text-green-400">${jml}</span> (+${jml-l})`,ada:true}:{teks:`<span class="text-red-400">${jml}</span> (-${l-jml})`,ada:true};
    }

    async function muatData(){
      try{
        // Cek status relog
        const stRelog=await fetch("/api/relog");
        const relog=await stRelog.json();
        if(relog.perintah==="true"){
          statusRelog.textContent="⏳ Menunggu eksekusi";
          btnRelog.textContent="⏳ Berjalan";
        }else{
          sedangRelog=false;
          btnRelog.disabled=false;
          btnRelog.textContent="🔄 Relog Server";
          statusRelog.textContent="✅ Siap";
        }

        // Ambil data utama
        const res=await fetch("/api/webhook",{cache:"no-store"});
        if(!res.ok)throw new Error("Putus");
        const d=await res.json();
        const data=d.data||{};
        const teksBaru=JSON.stringify(data);

        if(teksBaru!==teksLama){
          teksLama=teksBaru;

          // Dasar
          document.getElementById("waktu").textContent=d.waktu||"—";
          document.getElementById("nilaiUang").textContent=data.uangTeks||"0";
          document.getElementById("nilaiBerat").textContent=(data.beratTeks||"0")+" KG";
          document.getElementById("nilaiJumlah").textContent=(data.totalItem||0)+" buah";

          // Cuaca & Restock
          if(data.weatherText){document.getElementById("isiCuaca").textContent=data.weatherText;tandai("panelCuaca");}
          // Pet
          if(data.petText){document.getElementById("isiPet").textContent=data.petText;tandai("panelPet");}
          // ✅ Pemain
          if(data.playerText){document.getElementById("isiPemain").textContent=data.playerText;tandai("panelPemain");}
          // ✅ Chat
          if(data.chatText){document.getElementById("isiChat").textContent=data.chatText;tandai("panelChat");}

          // Barang
          let htmlBarang="";
          if(data.barang&&Object.keys(data.barang).length>0){
            const urut=Object.entries(data.barang).sort((a,b)=>b[1]-a[1]);
            for(const [n,j] of urut){
              const h=cekPerubahan(n,j,"barang");
              htmlBarang+=`<div class="mb-1">• ${n} × ${h.teks}</div>`;
            }
          }else htmlBarang="<span class='text-slate-500'>— Kosong —</span>";
          document.getElementById("isiBarang").innerHTML=htmlBarang;
          tandai("panelBarang");

          // Riwayat Panen/Jual
          const sekarang=new Date().toLocaleTimeString("id-ID");
          if(data.baruPanen&&Object.keys(data.baruPanen).length>0){
            for(const [n,j] of Object.entries(data.baruPanen)){
              simpan.riwayat.push({kelas:"text-green-400",waktu:sekarang,teks:`🌾 Panen: ${n} +${j}`});
            }
          }
          if(data.terjual&&Object.keys(data.terjual).length>0){
            for(const [n,j] of Object.entries(data.terjual)){
              simpan.riwayat.push({kelas:"text-red-400",waktu:sekarang,teks:`💸 Jual: ${n} -${j}`});
            }
          }
          if(simpan.riwayat.length>MAKS_LOG)simpan.riwayat=simpan.riwayat.slice(-MAKS_LOG);

          let htmlLog="";
          simpan.riwayat.forEach((itm,i)=>{
            const baru=i===simpan.riwayat.length-1?"baris-masuk":"";
            htmlLog+=`<div class="py-1 border-b border-slate-700/50 ${itm.kelas} ${baru}"><span class="text-slate-500 text-xs">${itm.waktu}</span> ${itm.teks}</div>`;
          });
          document.getElementById("isiLog").innerHTML=htmlLog;
          tandai("panelLog");
        }
      }catch(e){
        document.getElementById("isiBarang").innerHTML='<span class="text-red-400">❌ Terputus</span>';
      }
    }

    muatData();
    setInterval(muatData,2000);
  </script>
</body>
</html>
