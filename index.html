<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pemantau Data Farm - Tampilan Lengkap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { scrollbar-width: thin; scrollbar-color: #475569 #1e293b; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1e293b; border-radius: 999px; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 999px; }

    .panel { transition: all 0.2s ease; border-radius: 1rem; border: 1px solid #334155; background: #1e293b; }
    .panel-aktif { background: rgba(16,185,129,0.15); transform: scale(1.005); }
    .baris-masuk { animation: masuk 0.3s ease; }
    @keyframes masuk { from{opacity:0;transform:translateX(-6px)} to{opacity:1;transform:translateX(0)} }

    .tanda-tambah { color:#4ade80; font-weight:bold; }
    .tanda-jual { color:#f87171; font-weight:bold; }
    .tanda-perubahan { font-size:0.75rem; margin-left:0.5rem; opacity:0.85; }

    .kotak-uang { transition: 0.3s; }
    .berubah-uang { animation:kilau 0.5s ease; background:rgba(234,179,8,0.15); }
    @keyframes kilau { 0%,100%{box-shadow:none} 50%{box-shadow:0 0 10px rgba(234,179,8,0.3)} }

    .tinggi-panjang { max-height: 400px; overflow-y: auto; scroll-behavior: smooth; }
    .tinggi-log { max-height: 260px; overflow-y: auto; scroll-behavior: smooth; }
    .tinggi-info { max-height: 220px; overflow-y: auto; scroll-behavior: smooth; }

    .tombol-relog { transition: all 0.2s ease; }
    .tombol-relog:disabled { opacity:0.5; cursor:not-allowed; }
    .tombol-siap { background:#2563eb; }
    .tombol-proses { background:#ea580c; animation:denyut 1s infinite; }
    @keyframes denyut { 0%,100%{opacity:1} 50%{opacity:0.7} }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen p-3 md:p-4">
  <div class="w-full max-w-4xl mx-auto">
    <div class="flex items-center justify-between mb-5">
      <h1 class="text-2xl font-bold text-emerald-400">📡 Pemantauan Langsung</h1>
      <!-- ✅ TOMBOL RELOG -->
      <button id="btnRelog" class="tombol-relog tombol-siap px-4 py-2 rounded-xl font-semibold shadow-lg">
        🔄 Relog / Ganti Server
      </button>
    </div>

    <!-- Info Atas -->
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div class="panel p-3">
        <div class="text-slate-400 text-sm">🕒 Waktu Terima</div>
        <div id="waktu" class="font-semibold text-lg">—</div>
      </div>
      <div class="panel p-3">
        <div class="text-slate-400 text-sm">📶 Status</div>
        <div id="statusRelog" class="font-semibold text-sky-300">Siap</div>
      </div>
    </div>

    <!-- Ringkasan -->
    <div class="grid grid-cols-3 gap-3 mb-4">
      <div id="kotakUang" class="kotak-uang panel p-3 text-center">
        <div class="text-slate-400 text-sm">💰 Uang</div>
        <div id="nilaiUang" class="font-bold text-lg text-yellow-400">—</div>
      </div>
      <div class="panel p-3 text-center">
        <div class="text-slate-400 text-sm">📦 Total Berat</div>
        <div id="nilaiBerat" class="font-bold text-lg text-sky-400">—</div>
      </div>
      <div class="panel p-3 text-center">
        <div class="text-slate-400 text-sm">🧾 Jumlah Barang</div>
        <div id="nilaiJumlah" class="font-bold text-lg text-sky-400">—</div>
      </div>
    </div>

    <!-- ✅ BARU: CUACA & RESTOCK -->
    <div id="panelCuaca" class="panel p-4 mb-4">
      <h3 class="text-sky-400 font-semibold mb-2">🌤 Cuaca & Waktu Restock</h3>
      <div id="isiCuaca" class="tinggi-info text-sm pl-3 whitespace-pre-line text-slate-200">
        <span class="text-amber-400">Menunggu data...</span>
      </div>
    </div>

    <!-- ✅ BARU: PET LIAR DI PETA -->
    <div id="panelPet" class="panel p-4 mb-4">
      <h3 class="text-sky-400 font-semibold mb-2">🐾 Pet di Peta</h3>
      <div id="isiPet" class="tinggi-info text-sm pl-3 text-emerald-300">
        <span class="text-slate-500">— Belum terdeteksi —</span>
      </div>
    </div>

    <!-- 🎒 BARANG DI TAS - MUNCUL BARIS DEMI BARIS -->
    <div id="panelBarang" class="panel p-4 mb-4">
      <h3 class="text-sky-400 font-semibold mb-2">🎒 Barang di Tas</h3>
      <div id="isiBarang" class="tinggi-panjang text-sm pl-3">
        <span class="text-amber-400">Menunggu data...</span>
      </div>
    </div>

    <!-- 📜 LOG: PANEN + PENJUALAN DALAM SATU TEMPAT -->
    <div id="panelLog" class="panel p-4">
      <h3 class="text-sky-400 font-semibold mb-2">📜 Riwayat Panen & Penjualan</h3>
      <div id="isiLog" class="tinggi-log text-sm pl-3">
        <span class="text-slate-500">— Belum ada riwayat —</span>
      </div>
    </div>

    <p class="text-center text-slate-500 text-sm mt-4">🔄 Memperbarui setiap 2 detik</p>
  </div>

  <script>
    let simpan = { uang:"", barang:{}, berat:{}, riwayat:[] };
    const MAKS_LOG = 20;
    let teksLama = "";
    let sedangRelog = false;

    // --- KENDALI TOMBOL RELOG ---
    const btnRelog = document.getElementById("btnRelog");
    const statusRelog = document.getElementById("statusRelog");

    btnRelog.addEventListener("click", async () => {
      if (sedangRelog) return;
      sedangRelog = true;
      btnRelog.disabled = true;
      btnRelog.className = "tombol-relog tombol-proses px-4 py-2 rounded-xl font-semibold shadow-lg";
      statusRelog.textContent = "Mengirim perintah...";

      await fetch("/api/relog", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({perintah:"true"})
      });
    });

    function tandai(id) {
      const el = document.getElementById(id);
      el.classList.add("panel-aktif");
      setTimeout(()=>el.classList.remove("panel-aktif"),400);
    }

    // --- BANDINGKAN DAN BUAT TEKS PERUBAHAN ---
    function cekPerubahan(nama, jmlBaru, jenis) {
      const lama = simpan[jenis][nama] || 0;
      if (jmlBaru === lama) return {teks:jmlBaru, ada:false};

      simpan[jenis][nama] = jmlBaru;
      if (jmlBaru > lama) {
        return {teks:`<span class="tanda-tambah">${jmlBaru}</span><span class="tanda-perubahan">(+${jmlBaru-lama})</span>`, ada:true, selisih:jmlBaru-lama};
      } else {
        return {teks:`<span class="tanda-jual">${jmlBaru}</span><span class="tanda-perubahan">(-${lama-jmlBaru})</span>`, ada:true};
      }
    }

    async function muatData() {
      try {
        // --- Cek status relog dulu ---
        const stRelog = await fetch("/api/relog");
        const relogInfo = await stRelog.json();
        if (relogInfo.perintah === "true") {
          statusRelog.textContent = "⏳ Menunggu eksekusi di perangkat";
          btnRelog.className = "tombol-relog tombol-proses px-4 py-2 rounded-xl font-semibold shadow-lg";
        } else {
          if (sedangRelog) {
            sedangRelog = false;
            btnRelog.disabled = false;
            btnRelog.className = "tombol-relog tombol-siap px-4 py-2 rounded-xl font-semibold shadow-lg";
            statusRelog.textContent = "✅ Siap";
          } else {
            statusRelog.textContent = "✅ Siap";
          }
        }

        // --- Ambil data utama ---
        const res = await fetch("/api/webhook", {cache:"no-store"});
        if (!res.ok) throw new Error("Putus");
        const d = await res.json();
        const data = d.data || {};
        const teksBaru = JSON.stringify(data);

        if (teksBaru !== teksLama) {
          teksLama = teksBaru;

          // Info dasar
          document.getElementById("waktu").textContent = d.waktu || "—";
          const uangBaru = data.uangFormat || "0";
          if (uangBaru !== simpan.uang) {
            simpan.uang = uangBaru;
            document.getElementById("kotakUang").classList.add("berubah-uang");
            setTimeout(()=>document.getElementById("kotakUang").classList.remove("berubah-uang"),600);
          }
          document.getElementById("nilaiUang").textContent = uangBaru;
          document.getElementById("nilaiBerat").textContent = `${data.totalBeratFormat||"0"} KG`;
          document.getElementById("nilaiJumlah").textContent = `${data.totalItem||0} buah`;

          // ✅ TAMPILKAN CUACA & RESTOCK
          if (data.weatherRestockText) {
            document.getElementById("isiCuaca").textContent = data.weatherRestockText;
            tandai("panelCuaca");
          }

          // ✅ TAMPILKAN PET DI PETA
          if (data.petText) {
            document.getElementById("isiPet").textContent = data.petText;
            tandai("panelPet");
          }

          // --- 🎒 TAMPILKAN BARANG SATU PER SATU ---
          let htmlBarang = "";
          simpan.barang = {};
          if (data.barang && Object.keys(data.barang).length>0) {
            const urut = Object.entries(data.barang).sort((a,b)=>b[1]-a[1]);
            for (const [nama, jml] of urut) {
              const hasil = cekPerubahan(nama, jml, "barang");
              htmlBarang += `<div class="mb-2 relative baris-masuk">• ${nama} x${hasil.teks}</div>`;
            }
          } else htmlBarang = "<span class='text-slate-500'>— Kosong —</span>";

          // --- 📜 MASUKKAN KE RIWAYAT: PANEN BARU + PENJUALAN ---
          const sekarang = new Date().toLocaleTimeString("id-ID");

          if (data.dipanenBaru && Object.keys(data.dipanenBaru).length>0) {
            for (const [nama, jml] of Object.entries(data.dipanenBaru)) {
              simpan.berat[nama] = (simpan.berat[nama]||0)+jml;
              simpan.riwayat.push({
                kelas:"text-emerald-400",
                waktu:sekarang,
                teks:`🌾 <b>Panen:</b> ${nama} → +${jml}`
              });
            }
          }
          if (data.terjual && Object.keys(data.terjual).length>0) {
            for (const [nama, jml] of Object.entries(data.terjual)) {
              simpan.riwayat.push({
                kelas:"text-red-400",
                waktu:sekarang,
                teks:`💸 <b>Terjual:</b> ${nama} → -${jml}`
              });
            }
          }

          if (simpan.riwayat.length > MAKS_LOG) simpan.riwayat = simpan.riwayat.slice(-MAKS_LOG);

          document.getElementById("isiBarang").innerHTML = htmlBarang;
          tandai("panelBarang");
          setTimeout(()=>document.getElementById("isiBarang").scrollTop=9999,50);

          let htmlLog = "";
          simpan.riwayat.forEach((itm, i) => {
            const baru = i === simpan.riwayat.length - 1 ? "baris-masuk" : "";
            htmlLog += `<div class="py-2 border-b border-slate-700/50 ${itm.kelas} ${baru}">
              <span class="text-slate-500 text-xs">${itm.waktu}</span> ${itm.teks}
            </div>`;
          });
          document.getElementById("isiLog").innerHTML = htmlLog;
          tandai("panelLog");
          setTimeout(()=>document.getElementById("isiLog").scrollTop=9999,50);
        }

      } catch (e) {
        document.getElementById("isiBarang").innerHTML = '<span class="text-red-400">❌ Terputus</span>';
      }
    }

    muatData();
    setInterval(muatData, 2000);
  </script>
</body>
</html>
