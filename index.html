<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penerima Webhook - Data Farm</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-3xl bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700">
    <!-- Judul -->
    <h1 class="text-2xl font-bold text-center mb-6 text-emerald-400">📡 Data Terima Webhook</h1>

    <!-- Waktu Terima -->
    <div class="mb-6 p-4 bg-slate-700/50 rounded-xl">
      <span class="text-slate-400">Waktu Terima:</span>
      <div id="waktu" class="font-semibold text-lg text-white mt-1">—</div>
    </div>

    <!-- Isi Data - Tampilan Terstruktur -->
    <div class="mt-6">
      <span class="text-slate-400 font-medium">📋 Isi Data:</span>
      <div id="isiData" class="mt-3 bg-slate-900 p-5 rounded-xl overflow-x-auto text-sm leading-relaxed min-h-[120px]">
        <span class="text-slate-500">Menunggu data...</span>
      </div>
    </div>

    <p class="text-center text-slate-500 text-sm mt-6">Diperbarui otomatis setiap 3 detik</p>
  </div>

  <script>
    // Fungsi ubah teks mentah jadi tampilan rapi
    function formatDataTeks(teksMentah) {
      if (!teksMentah || teksMentah.trim() === "") {
        return '<span class="text-amber-400">⚠️ Data kosong atau belum terkirim</span>';
      }

      const baris = teksMentah.split('\n');
      let hasilHTML = '';

      baris.forEach(barisTeks => {
        const teks = barisTeks.trim();
        if (!teks) return;

        // Judul utama & Nama Pemain
        if (teks.includes('DATA FARM') || teks.startsWith('👤')) {
          hasilHTML += `<div class="text-emerald-400 font-bold text-lg mb-2 mt-1">${teks}</div>`;
        }
        // Garis pemisah
        else if (teks.match(/^[─-]{5,}$/)) {
          hasilHTML += `<div class="border-b border-slate-700 my-4"></div>`;
        }
        // Kategori utama
        else if (teks.includes('Uang') || teks.includes('Item Backpack') || teks.includes('Hasil Panen') || teks.includes('Total')) {
          hasilHTML += `<div class="text-sky-400 font-semibold mt-3 mb-2">${teks}</div>`;
        }
        // Daftar barang
        else if (teks.match(/x\d+/) || teks.includes('KG')) {
          hasilHTML += `<div class="text-emerald-300 pl-3 mb-1">• ${teks}</div>`;
        }
        // Waktu / Status
        else if (teks.includes('Waktu') || teks.includes('Masih Berjalan')) {
          hasilHTML += `<div class="text-amber-400 mt-3 text-sm">${teks}</div>`;
        }
        // Baris lain
        else {
          hasilHTML += `<div class="text-slate-300 mb-1">${teks}</div>`;
        }
      });

      return hasilHTML;
    }

    // Ambil data dari API dengan pengecekan ketat
    async function ambilData() {
      try {
        const res = await fetch("/api/webhook");
        if (!res.ok) throw new Error("Respon tidak baik");

        const data = await res.json();
        
        // ✅ Baca dengan aman sesuai format yang dikirim Termux
        const waktuTampil = data.waktu_lokal || data.waktu || "—";
        const isiTeks = data.konten || data.isi || "";

        // Tampilkan
        document.getElementById("waktu").textContent = waktuTampil;
        document.getElementById("isiData").innerHTML = formatDataTeks(isiTeks);

      } catch (err) {
        console.error(err);
        document.getElementById("isiData").innerHTML = 
          '<span class="text-red-400">❌ Gagal terhubung atau membaca data — pastikan skrip Termux sedang berjalan & sudah mengirim data minimal sekali</span>';
      }
    }

    ambilData();
    setInterval(ambilData, 3000);
  </script>
</body>
</html>
